_target_: fastwam.models.wan22.fastwam_dual_regime_fused.create_fused_dual_regime_fastwam_joint
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  # MUST isolate first-frame rows (first_frame_causal / per_frame_causal) —
  # the fused base regime relies on the first-frame tokens being a layer-exact
  # replica of base-branch inference. `bidirectional` is rejected at runtime.
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

train:
  # Fused single-pass dual-regime training (FusedDualRegimeFastWAMJoint).
  # ONE MoT forward per step over [noisy_video | action_joint | action_base]:
  #   - joint regime draft: action attends the full noisy video
  #   - base  regime draft: action attends only the clean first-frame columns
  # The video-denoising loss is computed exactly once, and inputs are VAE-encoded
  # exactly once (no `share_inputs` trade-off — the knob does not exist here).
  action_regime_weight_uncond: 1.0

adaptive:
  annotate_outputs: true
  allow_internal_routing: false
