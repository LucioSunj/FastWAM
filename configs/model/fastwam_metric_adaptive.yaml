_target_: fastwam.models.wan22.fastwam_metric_adaptive.create_metric_adaptive_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

train:
  # Dual-regime action training (corrected MetricAdaptiveFastWAM.training_loss).
  # Every step trains the shared action expert under BOTH inference regimes:
  #   - idm  regime: action conditions on the teacher-forced cond-video
  #   - base regime: action conditions on the clean first frame
  # The video-denoising loss is computed ONCE (in the idm forward only).
  action_regime_weight_base: 1.0   # w_base; 1.0 = equal idm/base action weight
  share_inputs: true               # true = single VAE encode/step (recommended)

adaptive:
  annotate_outputs: true
  metric:
    _target_: fastwam.routing.metrics.PolicyEntropyMetric
    probe_branch: base
    num_samples: 4
    bandwidth: silverman
    min_bandwidth: 1.0e-03
    leave_one_out: true
    reduction: mean
    normalize_by_dim: true
    seed_stride: 1009
    # Optional: make entropy probing cheaper than the final selected branch.
    # probe_overrides:
    #   num_inference_steps: 8
  selector:
    _target_: fastwam.routing.metrics.ThresholdSelector
    # Tune from logged `_routing.metric_value` on validation rollouts.
    threshold: 0.0
    low_branch: base
    high_branch: idm
    # High entropy means policy uncertainty, so choose IDM; low entropy uses base.
    mode: ge
