# @package _global_

defaults:
  - p1_dino_bc
  - _self_

runner:
  stage: canary
  output_dir: ${oc.env:FASTWAM_P1_FULL_OUTPUT_DIR,./runs/p1_dino_bc_full/${now:%Y-%m-%d}_${now:%H-%M-%S}}
  resume: null
  stop_after_steps: 2

p1:
  camera_input_contract:
    source_range_tolerance: 1.0e-6
    range_canonicalization: clamp_to_[0,1]_after_strict_tolerance_check
    uint8_conversion: round(clamped_value*255)
  camera_input_contract_sha256: 336d06c39a488c89b1404154b6ed8a9ee25969507611d8b06b884f8c2945e8e7

training:
  deterministic_algorithms: true
  stateless_flow_inputs: true
  microbatch_size: 32
  gradient_accumulation_steps: 1
  global_batch_size: 128
  max_steps: 2
  benchmark_steps: 8
  max_epochs: 10
  minimum_epochs: 3
  early_stopping_patience: 2
  early_checkpoint_steps: [10]
  save_every_steps: 100
  checkpoint_keep_last: 1

optimizer:
  lora_learning_rate: 3.0e-4
  reader_learning_rate: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  gradient_clip: 1.0
  warmup_fraction: 0.05
  minimum_lr_ratio: 0.01

validation:
  seed: 42

data:
  num_workers: 3
  prefetch_factor: 1
  train:
    return_p1_camera_uint8: true
    p1_camera_ids: ${p1.camera_ids}
    p1_camera_range_tolerance: ${p1.camera_input_contract.source_range_tolerance}
    image_current_frame_only: true
    processor:
      image_num_obs_steps: 1
  validation:
    return_p1_camera_uint8: true
    p1_camera_ids: ${p1.camera_ids}
    p1_camera_range_tolerance: ${p1.camera_input_contract.source_range_tolerance}
    image_current_frame_only: true
    processor:
      image_num_obs_steps: 1

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
