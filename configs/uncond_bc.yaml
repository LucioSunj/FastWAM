# @package _global_

defaults:
  - _self_
  - task: libero_uncond_lora_bc

precision: bf16
compile: false
seed: 42

runner:
  stage: formal
  single_gpu_diagnostic: false
  output_dir: ${oc.env:FASTWAM_BC_OUTPUT_DIR,./runs/uncond_lora_action_bc/${now:%Y-%m-%d}_${now:%H-%M-%S}}
  resume: null
  stop_after_steps: null

training:
  deterministic_algorithms: true
  stateless_flow_inputs: true
  microbatch_size: 1
  gradient_accumulation_steps: 32
  global_batch_size: 128
  max_steps: null
  max_epochs: 10
  minimum_epochs: 3
  early_stopping_patience: 2
  save_every_steps: 500
  checkpoint_keep_last: 1

optimizer:
  learning_rate: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  gradient_clip: 1.0
  warmup_fraction: 0.05
  minimum_lr_ratio: 0.01

validation:
  seed: 42

lora:
  rank: 16
  alpha: 16.0
  dropout: 0.0
  target_groups:
    - self_attention_qkvo
    - cross_attention_qkvo
    - ffn
  freeze_base: true
  strict_target_discovery: true

bc_policy:
  action_horizon: 32
  action_dim: 7
  proprio_dim: 8
  expected_video_frames: 9
  expected_video_height: 224
  expected_video_width: 448
  gripper_dimension: 6
  timestep_bins: 10
  tiled_vae: false

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
