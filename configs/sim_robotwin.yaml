# @package _global_

defaults:
  - train
  - override /task: robotwin_uncond_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: false
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: fastwam_policy
  task_name: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 100
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: null
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: ${eval_sigma_shift}
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  skip_get_obs_within_replan: true
  force_branch: base  # adaptive models: base (UNCOND) or idm
  render_every_frame: true
  eval_video_log: false
  eval_video_max_episodes: 1
  clear_cache_freq: 1
  visualize_future_video: false
  predicted_video_log_dir: null
  predicted_video_fps: 8
  predicted_video_max_episodes: 1
  predicted_video_max_replans_per_episode: null

  # Runtime inputs
  dataset_stats_path: null
  device: cuda
  text_embedding_cache_dir: /root/autodl-fs/fastwam_text_embeds_cache/robotwin_eval
  context_len: ${data.train.context_len}

MULTIRUN:
  enabled: false
  num_gpus: 8
  gpu_offset: 0
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
