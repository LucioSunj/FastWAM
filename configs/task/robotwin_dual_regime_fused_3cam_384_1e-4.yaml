# @package _global_

defaults:
  - override /data: robotwin
  - override /model: fastwam_dual_regime_fused
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  checkpoint_task: robotwin_dual_regime_fused_3cam_384_1e-4

# scheduler
lr_scheduler_type: "cosine"
# Warm-start pilot: deliberately below the from-backbone 1e-4 recipe.
learning_rate: 1e-5
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

dual_regime_training:
  uncond_weight_schedule:
    - {fraction: 0.0, weight: 0.05}
    - {fraction: 0.1, weight: 0.05}
    - {fraction: 0.4, weight: 0.5}
    - {fraction: 1.0, weight: 1.0}
  gradient_diagnostics_every: 200
  gradient_diagnostic_video_final_blocks: 2
  optimizer:
    action_lr_scale: 1.0
    proprio_lr_scale: 1.0
    video_lr_scale: 0.0
    video_final_blocks: 4
    video_train_start_fraction: 0.4
