# @package _global_

defaults:
  - libero_uncond_lora_bc
  - _self_

# Host-B rank-16 systems overlay. The model still receives the exact current
# frame used by the base preset, while unused future image timestamps never
# enter decode, resize, collation, or host-to-device transfer.
data:
  num_workers: 4
  prefetch_factor: 1
  multiprocessing_context: null
  persistent_workers: false
  train:
    current_frame_only: true
    strict_sample_loading: true
    processor:
      num_image_steps: 1
  validation:
    current_frame_only: true
    strict_sample_loading: true

training:
  ddp_static_graph: true
  ddp_gradient_as_bucket_view: true

validation:
  host_cleanup_interval_batches: 16

bc_policy:
  expected_video_frames: 1
