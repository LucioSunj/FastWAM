training:
  tiny_steps: 300
  short_steps: 1000
  matched_sample_budget: true
  matched_batch_order: true
  matched_flow_noise_timestep: true

lora:
  rank: 16
  alpha: 16.0
  dropout: 0.0
  target_groups:
    - self_attention_qkvo
    - cross_attention_qkvo
    - ffn

bc_policy:
  action_horizon: 32
  action_dim: 7
  proprio_dim: 8
  expected_video_frames: 9
  expected_video_height: 224
  expected_video_width: 448
  gripper_dimension: 6
  timestep_bins: 10
  tiled_vae: false

optimizer:
  lora_learning_rate: 3.0e-4
  reader_learning_rate: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  gradient_clip: 1.0

data:
  dataset_revision: libero_mujoco3.3.2+lerobot-v2.1
  dataset_info: /home/amax/data0/FastWAM-PERF-002-storage/root-migration-20260716T0311Z/Datasets/fastwam/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot/meta/info.json
