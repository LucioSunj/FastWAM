  dataset_metadata_sha256: 1362a116870cf13be50c55074d6e9071936d567d0e5df30ac5c1b2eee86aa7de
  smoke_window_indices: [0, 1]
  tiny_window_indices: [0, 1, 2, 3, 4, 5, 6, 7]
  short_train_episode_ids: [0, 1, 2, 3, 50, 51, 52, 53]
  short_dev_episode_ids: [4, 5, 54, 55]
  short_frame_index: 0
  split_contract: explicit_episode_disjoint_no_overlapping_windows
  smoke:
    _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs:
      - ${provenance.dataset_paths.0}
    shape_meta: ${data.train.shape_meta}
    num_frames: ${data.train.num_frames}
    global_sample_stride: ${data.train.global_sample_stride}
    action_video_freq_ratio: ${data.train.action_video_freq_ratio}
    video_size: ${data.train.video_size}
    camera_key: null
    val_set_proportion: 0.0
    is_training_set: true
    split_seed: ${seed}
    skip_padding_as_possible: false
    concat_multi_camera: horizontal
    text_embedding_cache_dir: ${provenance.text_cache_path}
    context_len: ${data.train.context_len}
    pretrained_norm_stats: ${parent.statistics}
    processor: ${data.train.processor}
    return_p1_camera_uint8: true
    p1_camera_ids: ${p1.camera_ids}

hydra:
