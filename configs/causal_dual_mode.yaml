# @package _global_

defaults:
  - _self_
  - task: libero_causal_dual_mode

precision: bf16
compile: false
seed: 42

runner:
  stage: model_acceptance
  output_dir: ${oc.env:FASTWAM_CAUSAL_OUTPUT_DIR,./runs/causal_prediction/${now:%Y-%m-%d}_${now:%H-%M-%S}}
  resume: null
  canary_optimizer_steps: null
  canary_warmup_optimizer_steps: null
  canary_validation_batches: null
  canary_cuda_synchronize_timing: false

training:
  exposure: dual_mode
  deterministic_algorithms: true
  stateless_flow_inputs: true
  num_gpus: 4
  microbatch_size: 8
  gradient_accumulation_steps: 4
  global_batch_size: 128
  samples_per_optimizer_step:
    c0_current: 64
    c2_full: 64
  max_epochs: 10
  minimum_epochs: 3
  early_stopping_patience: 2
  save_every_steps: 500
  checkpoint_keep_last: 1

optimizer:
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  gradient_clip: 1.0
  warmup_fraction: 0.05
  minimum_lr_ratio: 0.01

selection:
  attempt: primary
  equal_mode_validation_weight: true
  c2_teacher_degradation_limit: 0.02
  distillation_weight: 1.0
  single_retry_distillation_weight: 4.0
  retry_count_limit: 1

validation:
  seed: 42

shared_lora:
  rank: 16
  alpha: 16.0
  dropout: 0.0
  target_groups:
    - self_attention_qkvo
    - cross_attention_qkvo
    - ffn
  freeze_base: true
  strict_target_discovery: true

causal_policy:
  action_horizon: 32
  executed_action_horizon: 10
  action_dim: 7
  proprio_dim: 8
  expected_video_frames: 9
  expected_video_height: 224
  expected_video_width: 448
  gripper_dimension: 6
  action_flow_steps: 10
  environment_max_steps: 700
  timestep_bins: 10
  tiled_vae: false
  modes: [c0_current, c2_full]

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
